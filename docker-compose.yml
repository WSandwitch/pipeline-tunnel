services:
  server:
    image: pppltunnel:latest
    environment:
      MODE: server
      LISTEN: "0.0.0.0:34443"
      PASSWORD: changeme
      THREADS: 4
    ports:
      - "34443:34443"

  client:
    image: pppltunnel:latest
    environment:
      MODE: client
      LISTEN: "127.0.0.1:9999:10.0.0.1:80"
      CHAIN: "server:34443,changeme;base64"
      THREADS: 4
    ports:
      - "9999:9999"
    depends_on:
      - server

  # Example: iperf3 through tunnel
  iperf3-server:
    image: networkstatic/iperf3
    command: -s -p 5201

  tunnel-client:
    image: pppltunnel:latest
    environment:
      MODE: client
      LISTEN: "5201:iperf3-server:5201"
      CHAIN: "server:34443,changeme;copy"
    depends_on:
      - server
      - iperf3-server
